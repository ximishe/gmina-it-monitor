# ==============================================================================
# Gmina IT Monitor - Konfiguracja wirtualnego hosta dla Nginx na Ubuntu / Debian
# Umieść ten plik w /etc/nginx/sites-available/it-monitor i aktywuj:
# sudo ln -s /etc/nginx/sites-available/it-monitor /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    server_name adminmonitor.gminaleszno.local 192.168.13.14; # Domena i IP Twojego serwera Nginx

    root /var/www/html/it-monitor;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 10M;
    underscores_in_headers on;

    # Nagłówki bezpieczeństwa
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 1. Główny routing dashboardu i zapytań API
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. Umożliwienie pobierania skryptów agenta przez stacje robocze (GPO)
    location ^~ /agent/ {
        # Blokada plików konfiguracyjnych agenta zawierających token
        location ~* config.*\.ps1$ {
            deny all;
            return 404;
        }

        # Zezwól na pobieranie publicznych launcherów i skryptów (bootstrap.ps1, monitor.ps1)
        location ~* \.ps1$ {
            allow all;
            default_type text/plain;
        }
    }

    # 3. KRYTYCZNE DLA NGINX: Całkowita blokada dostępu do baz danych SQLite, zrzutów SQL i logów
    location ~* \.(sqlite|sqlite3|db|sql|log)$ {
        deny all;
        return 404;
    }

    # 4. KRYTYCZNE: Blokada bezpośredniego wglądu do katalogów wewnętrznych
    location ^~ /database/ {
        deny all;
        return 404;
    }

    location ^~ /config/ {
        deny all;
        return 404;
    }

    location ^~ /includes/ {
        deny all;
        return 404;
    }

    # 5. Blokada repozytorium .git i plików ukrytych (.env itp.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # 6. Obsługa skryptów PHP przez PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Wersja PHP-FPM na Ubuntu (np. php8.1-fpm, php8.2-fpm lub php8.3-fpm)
        # Sprawdź wersję na serwerze komendą: ls /var/run/php/
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Zabezpieczenie przed timeoutami przy aktualizacji z GitHuba
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # 7. Buforowanie zasobów statycznych (CSS, JS, ikony)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

