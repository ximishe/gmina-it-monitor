# ==============================================================================
# Gmina IT Monitor - Przykładowa konfiguracja wirtualnego hosta dla Nginx na Ubuntu
# Umieść ten plik w /etc/nginx/sites-available/it-monitor i aktywuj dowiązaniem:
# sudo ln -s /etc/nginx/sites-available/it-monitor /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name it-monitor.gmina.local 192.168.1.50; # Zmień na IP lub domenę serwera

    root /var/www/html/it-monitor;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 2M;

    # Nagłówki bezpieczeństwa
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 1. Główny routing dashboardu i zapytań
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. Umożliwienie pobierania skryptów agenta przez stacje robocze (GPO)
    location ^~ /agent/ {
        # Zezwól na pobieranie skryptów ps1 przez agentów AD
        location ~* \.ps1$ {
            allow all;
            default_type text/plain;
        }
        # Blokada innych plików w katalogu agenta (np. config.ps1 zawierającego token)
        location ~* config.*\.ps1$ {
            deny all;
            return 404;
        }
    }

    # 3. KRYTYCZNE: Blokada dostępu do bazy SQLite, zrzutów SQL i logów
    location ~* \.(sqlite|sqlite3|db|sql|log)$ {
        deny all;
        return 404;
    }

    # 4. KRYTYCZNE: Blokada bezpośredniego dostępu do wrażliwych katalogów
    location ^~ /database/ {
        deny all;
        return 404;
    }

    location ^~ /config/ {
        deny all;
        return 404;
    }

    location ^~ /includes/ {
        deny all;
        return 404;
    }

    # 5. Blokada repozytorium .git i plików ukrytych
    location ~ /\. {
        deny all;
        return 404;
    }

    # 6. Obsługa skryptów PHP przez PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Wersja PHP-FPM na Ubuntu (np. php8.1-fpm, php8.2-fpm lub php8.3-fpm)
        # Sprawdź swoją wersję poleceniem: ls /var/run/php/
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # 7. Buforowanie zasobów statycznych (CSS, JS, ikony)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
